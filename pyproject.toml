[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess"
version = "0.1.0"
description = "Motor de ajedrez y plataforma de bots"
requires-python = ">=3.9"

[project.optional-dependencies]
# Para la interfaz web: python -m pip install -e ".[web]"
web = ["streamlit"]

[tool.setuptools.packages.find]
where = ["src"]